# Local infrastructure for developing this dashboard.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# MongoDB is the only service here that this repo OWNS — it is the MCP corpus,
# and without it the MCP section is switched off (see `config.mcp` in
# backend/src/config/env.ts).
#
# Prometheus, Loki and Grafana are commented out on purpose. The dashboard's
# first subject, `automation-mock-playground-service`, ships its own
# observability stack and this app is a client of it; running a second copy
# here would give you two Grafanas and two sets of provisioned datasources
# fighting over the same uids. Bring them up from that repo instead, layering
# `docker-compose.override.yml` for iframe embedding, and provision the MCP
# dashboards from `./grafana` into that Grafana.
#
# Uncomment the block below only if you want a self-contained stack with no
# playground service running.

name: automation-monitoring-dashboard-dev

services:
    mongo:
        image: mongo:8
        restart: unless-stopped
        # Loopback-bound and unauthenticated: this is a development corpus on
        # your own machine, never a deployment.
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

